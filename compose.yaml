version: "3.9"

services:
  db:
    image: postgis/postgis:3.5-3.5-alpine
    container_name: kshitij-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kshitij_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_must_change}
      POSTGRES_DB: ${POSTGRES_DB:-kshitij_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kshitij_dev} -d ${POSTGRES_DB:-kshitij_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kshitij-smoke-test
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kshitij_db}
      POSTGRES_USER: ${POSTGRES_USER:-kshitij_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_must_change}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
    driver: local