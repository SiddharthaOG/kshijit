[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kshitij-model"
version = "0.1.0"
description = "Kshitij flood-connectivity model — synthetic terrain flood extent computation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "rasterio>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kshitij_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PIE", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF", "RET", "PTH", "FLY", "INP", "TCH", "DTZ", "EXE", "ISC", "PT", "RSE", "SIM", "TID", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true